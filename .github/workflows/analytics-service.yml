name: analytics-service CI/CD

on:
  pull_request:
    branches: [main]
    paths: ["toggle-master/analytics-service/**", ".github/workflows/analytics-service.yml"]
  push:
    branches: [main]
    paths: ["toggle-master/analytics-service/**", ".github/workflows/analytics-service.yml"]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: analytics-service
  LOCAL_IMAGE: local/analytics-service

jobs:
  build_unit_test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: toggle-master/analytics-service/requirements.txt
      - working-directory: toggle-master/analytics-service
        run: |
          python -m pip install --upgrade pip pytest
          pip install -r requirements.txt
          python -m compileall -q .
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -q
          else
            echo "Nenhum teste unitário Python encontrado."
          fi

  lint:
    name: Linter / static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - working-directory: toggle-master/analytics-service
        run: |
          python -m pip install --upgrade pip flake8
          flake8 --max-line-length=120 --extend-ignore=E203,W503 .

  security:
    name: SAST & SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Run Bandit
        working-directory: toggle-master/analytics-service
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r . -lll
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: toggle-master/analytics-service
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker_build_push:
    name: Docker build, scan & push
    needs: [build_unit_test, lint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --pull --tag "${LOCAL_IMAGE}:${GITHUB_SHA}" toggle-master/analytics-service
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/analytics-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: login_ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image tagged with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.login_ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
      - name: Update GitOps image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i "s|image: .*analytics-service:.*|image: ${{ steps.login_ecr.outputs.registry }}/analytics-service:${GITHUB_SHA}|" k8s/analytics.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/analytics.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): deploy analytics-service ${GITHUB_SHA::7}"
          git push
