name: evaluation-service CI/CD

on:
  pull_request:
    branches: [main]
    paths: ["toggle-master/evaluation-service/**", ".github/workflows/evaluation-service.yml"]
  push:
    branches: [main]
    paths: ["toggle-master/evaluation-service/**", ".github/workflows/evaluation-service.yml"]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: evaluation-service
  LOCAL_IMAGE: local/evaluation-service

jobs:
  build_unit_test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: toggle-master/evaluation-service/go.sum
      - working-directory: toggle-master/evaluation-service
        run: |
          go mod download
          go build ./...
          go test ./...

  lint:
    name: Linter / static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: toggle-master/evaluation-service/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.1
          working-directory: toggle-master/evaluation-service

  security:
    name: SAST & SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: toggle-master/evaluation-service/go.sum
      - name: Run gosec
        working-directory: toggle-master/evaluation-service
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          "$(go env GOPATH)/bin/gosec" -severity high ./...
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: toggle-master/evaluation-service
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker_build_push:
    name: Docker build, scan & push
    needs: [build_unit_test, lint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --pull --tag "${LOCAL_IMAGE}:${GITHUB_SHA}" toggle-master/evaluation-service
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/evaluation-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Log in to Amazon ECR
        id: login_ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image tagged with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.login_ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
      - name: Update GitOps image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i "s|image: .*evaluation-service:.*|image: ${{ steps.login_ecr.outputs.registry }}/evaluation-service:${GITHUB_SHA}|" k8s/evaluation.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/evaluation.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): deploy evaluation-service ${GITHUB_SHA::7}"
          git push
