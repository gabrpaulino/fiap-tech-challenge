fullnameOverride: otel-gateway
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.120.0
command:
  name: otelcol-contrib
presets:
  kubernetesAttributes:
    enabled: true
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 512Mi}
extraEnvs:
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef: {name: observability-integrations, key: new-relic-license-key}
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: {endpoint: '0.0.0.0:4317'}
        http: {endpoint: '0.0.0.0:4318'}
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 80
    batch: {timeout: 5s, send_batch_size: 512}
  exporters:
    debug: null
    prometheus:
      endpoint: '0.0.0.0:8889'
      resource_to_telemetry_conversion: {enabled: true}
    otlphttp/loki:
      endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
      sending_queue: {enabled: true, queue_size: 1000}
      retry_on_failure: {enabled: true}
    otlphttp/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}
      compression: gzip
      sending_queue: {enabled: true, queue_size: 1000}
      retry_on_failure: {enabled: true}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/newrelic]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [prometheus, otlphttp/newrelic]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]
