apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-auth
  namespace: auth-ns
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [auth-deployment]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-auth
  namespace: auth-ns
subjects:
  - kind: ServiceAccount
    name: self-healing
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: self-healing}
  template:
    metadata:
      labels: {app: self-healing}
    spec:
      serviceAccountName: self-healing
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runbook
          image: python:3.12-slim-bookworm
          command: [python, /app/app.py]
          env:
            - name: SELF_HEALING_TOKEN
              valueFrom:
                secretKeyRef: {name: observability-integrations, key: self-healing-token}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
      volumes:
        - name: code
          configMap: {name: self-healing-code}
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: observability
spec:
  selector: {app: self-healing}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: self-healing-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels: {app: self-healing}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: alertmanager}
      ports:
        - {protocol: TCP, port: 8080}
