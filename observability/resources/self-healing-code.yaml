# Generated by scripts/sync-observability-artifacts.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-code
  namespace: observability
data:
  app.py: |
    """Alertmanager runbook: authenticated, fixed-target, bounded rollout restart.
    
    Only the Kubernetes API is used; no shell, user-supplied resource or AWS keys.
    Last execution is stored on the Deployment so pod restarts preserve cooldown.
    """
    import datetime as dt
    import hmac
    import json
    import logging
    import os
    import ssl
    import threading
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    log = logging.getLogger("self-healing")
    TARGET = "/apis/apps/v1/namespaces/auth-ns/deployments/auth-deployment"
    STAMP = "kubectl.kubernetes.io/restartedAt"
    LOCK = threading.Lock()
    COOLDOWN = 1800
    MAX_AGE = 3600
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    
    
    def kube_request(method, path, payload=None):
        with open(SA + "/token", encoding="utf-8") as token:
            bearer = token.read().strip()
        request = urllib.request.Request(
            "https://kubernetes.default.svc" + path,
            data=json.dumps(payload).encode() if payload is not None else None,
            headers={"Authorization": "Bearer " + bearer,
                     "Content-Type": "application/json-patch+json"},
            method=method,
        )
        with urllib.request.urlopen(request, context=ssl.create_default_context(
                cafile=SA + "/ca.crt"), timeout=10) as response:
            return json.load(response)
    
    
    def parse_time(value):
        parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
        if parsed.tzinfo is None:
            raise ValueError("timestamp must have timezone")
        return parsed
    
    
    def mitigate(payload, now=None):
        now = now or dt.datetime.now(dt.timezone.utc)
        if payload.get("status") != "firing":
            return "ignored"
        eligible = False
        for alert in payload.get("alerts", []):
            labels = alert.get("labels", {})
            if (alert.get("status") == "firing"
                    and labels.get("alertname") == "AuthHighErrorRate"
                    and labels.get("service") == "auth-service"
                    and labels.get("namespace") == "auth-ns"):
                age = (now - parse_time(alert["startsAt"])).total_seconds()
                if 0 <= age <= MAX_AGE:
                    eligible = True
        if not eligible:
            return "ignored"
        with LOCK:
            deployment = kube_request("GET", TARGET)
            annotations = deployment["spec"]["template"]["metadata"].get("annotations", {})
            previous = annotations.get(STAMP)
            if previous and (now - parse_time(previous)).total_seconds() < COOLDOWN:
                return "cooldown"
            status = deployment.get("status", {})
            if status.get("observedGeneration", 0) < deployment["metadata"]["generation"]:
                return "rollout-in-progress"
            replicas = deployment["spec"].get("replicas", 1)
            if replicas == 0:
                return "scaled-to-zero"
            if status.get("updatedReplicas", 0) < replicas:
                return "rollout-in-progress"
            # resourceVersion prevents two replicas from both executing the restart.
            annotations[STAMP] = now.isoformat()
            patch = [
                {"op": "test", "path": "/metadata/resourceVersion",
                 "value": deployment["metadata"]["resourceVersion"]},
                {"op": "add", "path": "/spec/template/metadata/annotations",
                 "value": annotations},
            ]
            kube_request("PATCH", TARGET, patch)
            log.warning("rollout restart requested: auth-ns/auth-deployment")
            return "restart-requested"
    
    
    class Handler(BaseHTTPRequestHandler):
        def reply(self, status, data):
            body = json.dumps(data).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    
        def do_GET(self):
            self.reply(200 if self.path == "/health" else 404, {"status": "ok"})
    
        def do_POST(self):
            if self.path != "/alerts":
                return self.reply(404, {"error": "not found"})
            expected = "Bearer " + os.environ["SELF_HEALING_TOKEN"]
            if not hmac.compare_digest(self.headers.get("Authorization", ""), expected):
                return self.reply(401, {"error": "unauthorized"})
            try:
                length = int(self.headers.get("Content-Length", "0"))
                if not 0 < length <= 65536:
                    return self.reply(413, {"error": "invalid payload size"})
                payload = json.loads(self.rfile.read(length))
                result = mitigate(payload)
                self.reply(200, {"result": result})
            except (ValueError, KeyError, TypeError, AttributeError):
                self.reply(400, {"error": "invalid alert"})
            except (urllib.error.URLError, OSError):
                log.exception("Kubernetes API failed; Alertmanager should retry")
                self.reply(503, {"error": "mitigation failed"})
    
        def setup(self):
            super().setup()
            self.connection.settimeout(15)
    
    
    if __name__ == "__main__":
        logging.basicConfig(level=logging.INFO)
        if len(os.environ.get("SELF_HEALING_TOKEN", "")) < 32:
            raise SystemExit("SELF_HEALING_TOKEN must have at least 32 characters")
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
