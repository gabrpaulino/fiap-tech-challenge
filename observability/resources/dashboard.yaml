apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-dashboard
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  togglemaster.json: "{\n  \"uid\": \"togglemaster-health\",\n  \"title\": \"ToggleMaster\
    \ — Saúde do ecossistema\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"\
    refresh\": \"5s\",\n  \"time\": {\n    \"from\": \"now-30m\",\n    \"to\": \"\
    now\"\n  },\n  \"tags\": [\n    \"togglemaster\",\n    \"fase4\"\n  ],\n  \"panels\"\
    : [\n    {\n      \"id\": 1,\n      \"title\": \"CPU por namespace (cores)\",\n\
    \      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n  \
    \      \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n    \
    \  },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n        \
    \  \"expr\": \"sum(rate(container_cpu_usage_seconds_total{container!=\\\"\\\"\
    ,container!=\\\"POD\\\"}[5m])) by (namespace)\",\n          \"legendFormat\":\
    \ \"{{service_name}}{{namespace}}\"\n        }\n      ],\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"cores\"\n        },\n    \
    \    \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n     \
    \ \"id\": 2,\n      \"title\": \"Memória por namespace\",\n      \"type\": \"\
    timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n \
    \       \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n    \
    \    \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n  \
    \    \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
    : \"sum(container_memory_working_set_bytes{container!=\\\"\\\",container!=\\\"\
    POD\\\"}) by (namespace)\",\n          \"legendFormat\": \"{{service_name}}{{namespace}}\"\
    \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n   \
    \       \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n\
    \      \"options\": {}\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Requisições\
    \ por segundo / serviço\",\n      \"type\": \"timeseries\",\n      \"gridPos\"\
    : {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\":\
    \ 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n  \
    \      \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n  \
    \        \"refId\": \"A\",\n          \"expr\": \"sum(rate(tm_http_requests_total[5m]))\
    \ by (service_name)\",\n          \"legendFormat\": \"{{service_name}}{{namespace}}\"\
    \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n   \
    \       \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n\
    \      \"options\": {}\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Erros\
    \ HTTP 5xx (%)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n   \
    \     \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n  \
    \    },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"\
    uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"\
    refId\": \"A\",\n          \"expr\": \"100 * (sum(rate(tm_http_requests_total{http_status_code=~\\\
    \"5..\\\"}[5m])) by (service_name) / sum(rate(tm_http_requests_total[5m])) by\
    \ (service_name))\",\n          \"legendFormat\": \"{{service_name}}{{namespace}}\"\
    \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n   \
    \       \"unit\": \"percent\"\n        },\n        \"overrides\": []\n      },\n\
    \      \"options\": {}\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Réplicas\
    \ disponíveis\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n    \
    \    \"x\": 0,\n        \"y\": 16,\n        \"w\": 12,\n        \"h\": 8\n   \
    \   },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"\
    uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"\
    refId\": \"A\",\n          \"expr\": \"sum(kube_deployment_status_replicas_available{namespace=~\\\
    \"auth-ns|flag-ns|targeting-ns|evaluation-ns|analytics-ns\\\"}) by (namespace)\"\
    ,\n          \"legendFormat\": \"{{service_name}}{{namespace}}\"\n        }\n\
    \      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\"\
    : \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\"\
    : {}\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Reinícios de contêineres\
    \ (15 min)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n       \
    \ \"x\": 12,\n        \"y\": 16,\n        \"w\": 12,\n        \"h\": 8\n     \
    \ },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\"\
    : \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"sum(increase(kube_pod_container_status_restarts_total{namespace=~\\\
    \"auth-ns|flag-ns|targeting-ns|evaluation-ns|analytics-ns\\\"}[15m])) by (namespace)\"\
    ,\n          \"legendFormat\": \"{{service_name}}{{namespace}}\"\n        }\n\
    \      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\"\
    : \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\"\
    : {}\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Logs dos contêineres\
    \ — atualização a cada 5s\",\n      \"type\": \"logs\",\n      \"gridPos\": {\n\
    \        \"x\": 0,\n        \"y\": 24,\n        \"w\": 24,\n        \"h\": 8\n\
    \      },\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\"\
    : \"loki\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"\
    A\",\n          \"expr\": \"{k8s_namespace_name=~\\\"auth-ns|flag-ns|targeting-ns|evaluation-ns|analytics-ns\\\
    \"}\",\n          \"legendFormat\": \"{{service_name}}{{namespace}}\"\n      \
    \  }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"\
    unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\"\
    : {\n        \"showTime\": true,\n        \"wrapLogMessage\": true\n      }\n\
    \    }\n  ]\n}"
